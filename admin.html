<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SEV7N FOLD / Site Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#f6f3ee;font:14px 'DM Sans',sans-serif}main{max-width:1000px;margin:auto;padding:36px 22px 80px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #393735;padding:10px 0 26px}.eyebrow,small{font-size:10px;letter-spacing:.16em;color:#b4a2e7}.display{font:700 clamp(42px,8vw,84px)/.9 'Barlow Condensed',sans-serif;margin:24px 0}.card{background:#1b1b1b;border:1px solid #343434;padding:22px;margin:16px 0}button,input,textarea,select{font:inherit}button{background:#a98aff;color:#111;border:0;padding:12px 16px;cursor:pointer}input,textarea,select{background:#101010;color:#fff;border:1px solid #494949;padding:12px;width:100%;margin:7px 0 14px}textarea{min-height:80px}label{display:block;color:#bbb;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{border-top:1px solid #393735;padding:15px 0;display:grid;grid-template-columns:1fr auto;gap:14px}.status{color:#aaa}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}}</style><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script><script defer src="runtime-config.js"></script><script defer src="supabase-client.js"></script></head><body><main><div class="top"><a href="index.html">SEV7N FOLD / BACK TO SITE</a><button id="signout" hidden>Sign out</button></div><p class="eyebrow">PRIVATE CONTENT DESK</p><h1 class="display">SITE ADMIN<span style="color:#8a4dff">.</span></h1><div id="status" class="status card">Checking configuration…</div><section id="login" class="card" hidden><h2>Sign in by email</h2><p>We’ll send a secure sign-in link to the authorized site administrator.</p><form id="login-form"><label>Admin email<input type="email" name="email" value="sevenfold.ng@gmail.com" required></label><button>Send sign-in link</button></form></section><div id="dashboard" hidden><section class="card"><h2>Portfolio projects</h2><form id="project-form" class="grid"><label>Project name<input name="name" required></label><label>Slug<input name="slug" required></label><label>Category<input name="type"></label><label>Meta label<input name="meta"></label><label>Page path<input name="href" placeholder="fold-motion.html"></label><label>Interface image path<input name="media" placeholder="assets/…png"></label><label>Architecture image path<input name="art" placeholder="assets/…jpg"></label><label>Display order<input name="sort_order" type="number" value="0"></label><label style="grid-column:1/-1">Summary<textarea name="summary"></textarea></label><label><input style="width:auto" type="checkbox" name="published"> Publish on site</label><button>Save project</button></form><div id="projects"></div></section><section class="card"><h2>Cinematic films</h2><form id="film-form" class="grid"><label>Title<input name="title" required></label><label>Slug<input name="slug" required></label><label>Film link<input name="video_url" type="url" required placeholder="TikTok post or MP4 URL"></label><label>Display order<input name="sort_order" type="number" value="0"></label><label style="grid-column:1/-1">Film note<input name="note"></label><label style="grid-column:1/-1">Storyboard beats, one per line<textarea name="storyboard"></textarea></label><label><input style="width:auto" type="checkbox" name="published"> Publish in sequence</label><button>Add film</button></form><div id="films"></div></section><section class="card"><h2>Project conversations</h2><div id="bookings"></div></section></div></main><script defer src="admin.js"></script></body></html>
